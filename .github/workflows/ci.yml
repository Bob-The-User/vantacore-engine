name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: "latest"
          cache: true

      - name: License audit
        run: pixi run pip-licenses --format=json | python scripts/check_licenses.py

      - name: Lint
        run: pixi run ruff check vantacore_engine/ tests/ --select E,F,W --ignore E501

      - name: Unit tests
        run: pixi run pytest tests/unit/ -v --timeout=60
